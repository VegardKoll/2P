<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likninger og ulikheter – øving med sjekk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --band:#24584A; --band-deep:#1B463B; --band-ink:#F1F6F2;
  --ink:#1D2A2E; --muted:#56656A; --paper:#FBFCFA; --card:#FFFFFF;
  --line:#D5DDD8; --soft:#EEF3EF; --accent:#C8920F; --accent-soft:#FBF1D6;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#B4443A; --bad-soft:#F8E4E1;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Header band */
header.band{background:var(--band);color:var(--band-ink)}
.band-inner{max-width:1180px;margin:0 auto;padding:22px 24px 6px;display:flex;align-items:center;gap:24px}
.titles{flex:1;min-width:0}
.band h1{font-size:2.1rem;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.band p{margin:0 0 12px;opacity:.88;max-width:56ch}
.scale{width:160px;flex:none}
.scale .beam{transform-origin:80px 34px;transform:rotate(-8deg);transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.scale text{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--band-deep)}
nav.okter{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.okter button{border:0;background:transparent;color:var(--band-ink);padding:10px 16px 12px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;opacity:.85}
nav.okter button:hover{opacity:1;background:var(--band-deep)}
nav.okter button[aria-selected="true"]{background:var(--paper);color:var(--ink);opacity:1;font-weight:700}
nav.okter .n{display:inline-block;min-width:1.4em;font-weight:700}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px;align-items:start}
@media (max-width:880px){.wrap{grid-template-columns:1fr}.band h1{font-size:1.7rem}.scale{width:110px}}
@media (max-width:520px){.scale{display:none}}
main h2{font-size:1.5rem;margin:0 0 14px;line-height:1.2}

.huske{background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;margin:0 0 14px}
.huske strong{display:block;margin-bottom:2px}
details.eks{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 22px}
details.eks summary{cursor:pointer;padding:12px 18px;font-weight:700}
details.eks .body{padding:0 18px 14px}
details.eks .line{font-size:1.08rem;margin:2px 0}
details.eks .note{color:var(--muted);font-size:.95rem}

/* Spor tabs */
.spor{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.spor button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px;cursor:pointer;text-align:left;line-height:1.25}
.spor button small{display:block;color:var(--muted);font-size:.82rem}
.spor button[aria-selected="true"]{border-color:var(--band);background:var(--soft)}
.spor .count{font-size:.82rem;color:var(--muted)}

/* Tasks */
.task{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:14px 18px 16px;margin:0 0 14px}
.task.solved{border-left-color:var(--ok)}
.task .head{display:flex;gap:12px;align-items:baseline}
.task .num{font-weight:700;color:var(--band);min-width:2.4em}
.task .q{flex:1}
.task .math{font-size:1.2rem}
.task .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-left:calc(2.4em + 12px)}
.task input[type=text]{border:2px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:220px;background:var(--paper)}
.task input.small{width:110px}
.task label.pl{display:flex;align-items:center;gap:6px}
.task input:focus{border-color:var(--band);outline:none}
.btn{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.main{background:var(--band);color:#fff}
.btn.main:hover{background:var(--band-deep)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--band)}
.sym{display:flex;gap:4px}
.sym button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:4px 9px;cursor:pointer;min-width:2.2em}
.choices{display:flex;flex-direction:column;gap:6px;width:100%}
.choices button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer}
.choices button:hover{border-color:var(--band)}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;padding-left:calc(2.4em + 12px)}
.fb .msg{border-radius:8px;padding:8px 12px;margin-top:6px}
.fb .ok{background:var(--ok-soft);color:#1E5535}
.fb .bad{background:var(--bad-soft);color:#7E2A22}
.fb .hint{background:var(--accent-soft)}
.fb .steps{background:var(--soft)}
.fb .steps div{margin:2px 0}
.hint-format{color:var(--muted);font-size:.88rem;padding-left:calc(2.4em + 12px);margin-top:6px}

.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}

/* Bisection widget */
.bis table{border-collapse:collapse;width:100%;margin:10px 0;font-variant-numeric:tabular-nums}
.bis-wrap{overflow-x:auto}
.bis th,.bis td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.bis th:first-child,.bis td:first-child{text-align:left}
.bis .pos{color:var(--ok);font-weight:700}
.bis .neg{color:var(--bad);font-weight:700}

/* Sidebar */
aside{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
@media (max-width:880px){aside{position:static}}
aside section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
aside h3{margin:0 0 6px;font-size:1.02rem;color:var(--band)}
aside ul{margin:0;padding-left:1.1em}
aside li{margin:3px 0}
.prog-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0;font-size:.92rem}
.bar{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);transition:width .4s}
.prog-row.cur{font-weight:700}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem;margin-top:6px}

@media (prefers-reduced-motion:reduce){.scale .beam,.bar span{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <div class="titles">
      <h1>Likninger og ulikheter</h1>
      <p>Velg økt, jobb deg gjennom sporene og trykk «Sjekk svar». Fremdriften lagres i nettleseren.</p>
    </div>
    <svg class="scale" viewBox="0 0 160 112" aria-hidden="true">
      <polygon points="80,34 66,104 94,104" fill="#F1F6F2" opacity=".9"/>
      <rect x="50" y="102" width="60" height="6" rx="3" fill="#F1F6F2" opacity=".9"/>
      <g class="beam" id="beam">
        <rect x="10" y="31" width="140" height="6" rx="3" fill="#C8920F"/>
        <line x1="22" y1="36" x2="22" y2="58" stroke="#F1F6F2" stroke-width="2"/>
        <line x1="138" y1="36" x2="138" y2="58" stroke="#F1F6F2" stroke-width="2"/>
        <rect x="4" y="58" width="36" height="24" rx="5" fill="#F1F6F2"/>
        <rect x="120" y="58" width="36" height="24" rx="5" fill="#F1F6F2"/>
        <text x="22" y="75" text-anchor="middle">2x</text>
        <text x="138" y="75" text-anchor="middle">10</text>
      </g>
      <circle cx="80" cy="34" r="5" fill="#1B463B"/>
    </svg>
  </div>
  <nav class="okter" role="tablist" id="okter"></nav>
</header>

<div class="wrap">
  <main id="main"></main>
  <aside>
    <section><h3>Dagens mål</h3><ul id="mal"></ul></section>
    <section><h3>Tips</h3><ul id="tips"></ul></section>
    <section><h3>Fremdrift</h3><div id="prog"></div><button class="reset" id="reset">Nullstill fremdrift</button></section>
  </aside>
</div>

<script>
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const METODER = ['Ta kvadratrot (husk ±)', 'Sett x utenfor parentes', 'Produktregelen direkte', 'abc-formelen'];

const OKTER = [
{
  id: 'o1', nav: 'Lineære', title: 'Økt 1: Lineære likninger og ulikheter',
  mal: ['Løse likninger med x på begge sider', 'Fjerne brøk med fellesnevneren', 'Vite når ulikhetstegnet skal snus'],
  tips: ['Sett prøve: regn ut venstre og høyre side med svaret ditt.', 'Brøk? Gang hvert ledd med fellesnevneren.', 'Del eller gang med et negativt tall i en ulikhet? Snu tegnet.'],
  huske: 'Det du gjør på den ene siden, gjør du på den andre. I en ulikhet snur du tegnet når du ganger eller deler med et negativt tall.',
  eks: ['3x − 4 = x + 6', '3x − x = 6 + 4', '2x = 10', 'x = 5'],
  eksNote: 'Prøve: 3 · 5 − 4 = 11 og 5 + 6 = 11. Venstre side = høyre side.',
  spor: {

      {q: '2x − 3 = 11', type: 'num', ans: [7], hint: 'Legg til 3 på begge sider først, og del så på 2.', steps: ['2x = 14', 'x = 7']},
      {q: '4x + 1 = 2x + 9', type: 'num', ans: [4], hint: 'Samle x-leddene på venstre side og tallene på høyre side.', steps: ['4x − 2x = 9 − 1', '2x = 8', 'x = 4']},
      {q: '3(x − 1) = 12', type: 'num', ans: [5], hint: 'Gang ut parentesen først: 3 · x og 3 · (−1).', steps: ['3x − 3 = 12', '3x = 15', 'x = 5']},
      {q: '2x < 14', type: 'ineq', ans: ['x<7'], hint: 'Del på 2. Tallet er positivt, så tegnet blir stående.', steps: ['x < 7']},
      {q: '−3x > 12', type: 'ineq', ans: ['x<-4'], hint: 'Du deler på et negativt tall. Hva må skje med tegnet?', steps: ['Del på −3 og snu tegnet', 'x < −4']}
    ],
    2: [
      {q: `${F('x', 5)} + 2 = 6`, type: 'num', ans: [20], hint: 'Trekk fra 2 først, og gang så med 5.', steps: [`${F('x', 5)} = 4`, 'x = 20']},
      {q: `${F('x', 2)} − 1 = ${F('x', 4)} + 2`, type: 'num', ans: [12], hint: 'Fellesnevneren er 4. Gang hvert ledd med 4.', steps: ['2x − 4 = x + 8', 'x = 12']},
      {q: `${F('x + 2', 3)} = ${F('x − 2', 2)}`, type: 'num', ans: [10], hint: 'Kryssmultipliser: 2(x + 2) = 3(x − 2).', steps: ['2x + 4 = 3x − 6', '10 = x']},
      {q: '7 − 3x ≥ 1', type: 'ineq', ans: ['x≤2'], hint: 'Trekk fra 7, og del på −3. Husk å snu tegnet.', steps: ['−3x ≥ −6', 'x ≤ 2']},
      {q: `${F('x', 3)} + 1 > ${F('x', 2)}`, type: 'ineq', ans: ['x<6'], hint: 'Gang alle ledd med 6.', steps: ['2x + 6 > 3x', '6 > x, altså x < 6']}
    ],
    3: [
      {q: 'Et mobilspill er gratis, men hvert ekstraliv koster 12 kr. Premiumversjonen koster 149 kr én gang og gir ubegrenset med liv. Hvor mange ekstraliv må du kjøpe før premium blir billigst?', type: 'num', ans: [13], plain: true, hint: 'Sett opp ulikheten 12x > 149. Svaret må være et helt tall.', steps: ['12x > 149', 'x > 12,4', 'Fra 13 ekstraliv er premium billigst.']},
      {q: 'Mia har 180 kr og sparer 45 kr hver uke. Jonas har 420 kr og bruker 15 kr hver uke. Etter hvor mange uker har de like mye?', type: 'num', ans: [4], plain: true, hint: 'Sett opp 180 + 45x = 420 − 15x.', steps: ['180 + 45x = 420 − 15x', '60x = 240', 'x = 4 uker']}
    ]
  }
},
{
  id: 'o2', nav: 'Andregrad', title: 'Økt 2: Andregradslikninger og -ulikheter',
  mal: ['Velge riktig metode ut fra hvordan likningen ser ut', 'Bruke abc-formelen', 'Løse andregradsulikheter med nullpunkter og skisse'],
  tips: ['Ordne alltid først: 0 på høyre side.', 'Negativt tall under rottegnet betyr ingen løsning.', 'Smilende parabel: negativ mellom nullpunktene, positiv utenfor.'],
  huske: 'Se på likningen før du regner. Bare x² og et tall: kvadratrot med ±. Ingen konstantledd: sett x utenfor parentes. Alle tre ledd: abc-formelen.',
  eks: ['x² − 2x − 8 = 0, der a = 1, b = −2, c = −8', `x = ${F('2 ± √(4 + 32)', 2)} = ${F('2 ± 6', 2)}`, 'x = 4 eller x = −2'],

  spor: {

      {q: 'Hvilken metode passer best? <span class="math">x² − 3x = 0</span>', type: 'choice', options: METODER, correct: 1, plain: true, hint: 'Det er ikke noe konstantledd.', steps: ['x(x − 3) = 0 gir x = 0 eller x = 3']},
      {q: 'Hvilken metode passer best? <span class="math">(x + 1)(x − 7) = 0</span>', type: 'choice', options: METODER, correct: 2, plain: true, hint: 'Likningen er allerede et produkt som er lik 0.', steps: ['x = −1 eller x = 7']},
      {q: 'Hvilken metode passer best? <span class="math">x² + 3x − 10 = 0</span>', type: 'choice', options: METODER, correct: 3, plain: true, hint: 'Alle tre ledd er med.', steps: ['x = 2 eller x = −5']},
      {q: 'x² = 81', type: 'num', ans: [9, -9], hint: 'Hvilke to tall ganget med seg selv gir 81?', steps: ['x = 9 eller x = −9']},

      {q: 'x² − 9x = 0', type: 'num', ans: [0, 9], hint: 'Sett x utenfor parentes: x(x − 9) = 0.', steps: ['x(x − 9) = 0', 'x = 0 eller x = 9']},
      {q: 'x² + 7x + 10 = 0', type: 'num', ans: [-2, -5], hint: 'a = 1, b = 7, c = 10. Diskriminanten er 49 − 40 = 9.', steps: [`x = ${F('−7 ± 3', 2)}`, 'x = −2 eller x = −5']},
      {q: 'x² + x + 3 = 0', type: 'num', ans: 'ingen', hint: 'Regn ut diskriminanten b² − 4ac.', steps: ['b² − 4ac = 1 − 12 = −11', 'Negativt tall under rottegnet: ingen løsning']}
    ],
    2: [
      {q: 'x² = 2x + 15', type: 'num', ans: [5, -3], hint: 'Ordne først: x² − 2x − 15 = 0.', steps: ['x² − 2x − 15 = 0', `x = ${F('2 ± √64', 2)} = ${F('2 ± 8', 2)}`, 'x = 5 eller x = −3']},
      {q: '2x² − 5x − 3 = 0', type: 'num', ans: [3, -0.5], hint: 'a = 2, b = −5, c = −3. Pass på at nevneren blir 2a = 4.', steps: [`x = ${F('5 ± √49', 4)} = ${F('5 ± 7', 4)}`, 'x = 3 eller x = −1/2']},
      {q: 'x² − 16 < 0', type: 'ineq', ans: ['-4<x<4'], hint: 'Nullpunktene er −4 og 4. Parabelen smiler. Hvor er den under x-aksen?', steps: ['Nullpunkter: x = −4 og x = 4', 'Negativ mellom nullpunktene', '−4 < x < 4']},
      {q: 'x² − 4x > 0', type: 'ineq', ans: ['x<0|x>4'], hint: 'Nullpunkter: x(x − 4) = 0. Hvor er parabelen over x-aksen?', steps: ['Nullpunkter: 0 og 4', 'Positiv utenfor nullpunktene', 'x < 0 eller x > 4']},
      {q: 'x² + 2x − 8 ≤ 0', type: 'ineq', ans: ['-4≤x≤2'], hint: 'Finn nullpunktene med abc-formelen først.', steps: ['Nullpunkter: x = −4 og x = 2', '−4 ≤ x ≤ 2']},
      {q: 'Hvor mange løsninger har <span class="math">x² − 10x + 25 = 0</span>?', type: 'num', ans: [1], plain: true, hint: 'Regn ut diskriminanten b² − 4ac.', steps: ['b² − 4ac = 100 − 100 = 0', 'Én løsning']}
    ],
    3: [
      {q: 'Bestem k slik at <span class="math">x² + 8x + k = 0</span> har nøyaktig én løsning. Skriv verdien av k.', type: 'num', ans: [16], plain: true, hint: 'Én løsning betyr at diskriminanten er 0.', steps: ['64 − 4k = 0', 'k = 16']},
      {q: 'En ball kastes opp. Høyden etter t sekunder er <span class="math">h(t) = −5t² + 15t + 2</span> meter. Når er ballen høyere enn 12 meter? Skriv svaret som en ulikhet med t.', type: 'ineq', v: 't', ans: ['1<t<2'], plain: true, hint: 'Sett opp −5t² + 15t + 2 > 12. Del alle ledd på −5, og snu tegnet.', steps: ['−5t² + 15t − 10 > 0', 't² − 3t + 2 < 0', '(t − 1)(t − 2) < 0', '1 < t < 2']}

    2: [

      {q: '2x + 3y = 13 og 3x − 2y = 0', type: 'pair', labels: ['x', 'y'], ans: [2, 3], hint: 'Gang den første likningen med 2 og den andre med 3. Da forsvinner y når du legger sammen.', steps: ['4x + 6y = 26 og 9x − 6y = 0', '13x = 26, x = 2', '4 + 3y = 13, y = 3']},

    ]

const SPOR_LABELS = {1: ['Spor 1', 'Grunnleggende'], 2: ['Spor 2', 'Eksamensnivå'], 3: ['Spor 3', 'Utfordring']};
const KEY = 'jobloop-likninger-ulikheter-v1';
let solved = load();
let cur = {okt: 0, spor: 1};
const attempts = {};

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(solved)); } catch (e) {} }
const fmt = n => String(Math.round(n * 1000) / 1000).replace('.', ',').replace('-', '−');

/* ---------- Parsing ---------- */
function parseNum(t) {
  t = String(t).trim().replace(/[−–]/g, '-').replace(/,/g, '.');
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(t)) { const [p, q] = t.split('/'); return parseFloat(p) / parseFloat(q); }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return parseFloat(t);
  return NaN;
}
function parseList(s) {
  s = s.toLowerCase().replace(/[−–]/g, '-');
  if (/ingen/.test(s)) return 'ingen';
  s = s.replace(/[a-zæøå]\s*=\s*/g, ' ')
       .replace(/\bog\b|\beller\b|;/g, ' ')
       .replace(/,(?=\s|-|\+|±)/g, ' ')
       .replace(/\+-/g, '±');
  const out = [];
  for (const tok of s.split(/\s+/).filter(Boolean)) {
    if (tok.startsWith('±')) { const n = parseNum(tok.slice(1)); out.push(n, -n); }
    else out.push(parseNum(tok));
  }
  if (!out.length || out.some(isNaN)) return null;
  return out;
}
const FLIP = {'<': '>', '>': '<', '≤': '≥', '≥': '≤'};
function canonN(t) { const n = parseNum(t); return isNaN(n) ? '?' : String(Math.round(n * 1000) / 1000); }
function normIneq(s, v) {
  s = s.toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-')
       .replace(/<=|=</g, '≤').replace(/>=|=>/g, '≥').replace(/eller/g, '|');
  const parts = s.split('|').filter(Boolean).map(p => {
    let m;
    if ((m = p.match(/^(.+?)([<≤])([a-z])([<≤])(.+)$/))) return `${canonN(m[1])}${m[2]}${v}${m[4]}${canonN(m[5])}`;
    if ((m = p.match(/^(.+?)([>≥])([a-z])([>≥])(.+)$/))) return `${canonN(m[5])}${FLIP[m[4]]}${v}${FLIP[m[2]]}${canonN(m[1])}`;
    if ((m = p.match(/^([a-z])([<>≤≥])(.+)$/))) return `${v}${m[2]}${canonN(m[3])}`;
    if ((m = p.match(/^(.+)([<>≤≥])([a-z])$/))) return `${v}${FLIP[m[2]]}${canonN(m[1])}`;
    return '??';
  });
  return parts.sort().join('|');
}
const close = (a, b, tol = 0.011) => Math.abs(a - b) < tol;

function check(task, vals) {
  if (task.type === 'num') {
    const got = parseList(vals[0]);
    if (got === null) return {ok: false, msg: 'Jeg forstår ikke svaret. Skriv bare tall, for eksempel «3 og −5» eller «ingen».'};
    if (task.ans === 'ingen') return got === 'ingen' ? {ok: true} : {ok: false, msg: 'Ikke riktig. Sjekk om likningen har noen løsning i det hele tatt.'};
    if (got === 'ingen') return (task.ans.length === 1 && task.ans[0] === 0) ? {ok: true} : {ok: false, msg: 'Denne likningen har løsning. Prøv igjen.'};
    const a = [...task.ans].sort((x, y) => x - y), g = [...got].sort((x, y) => x - y);
    if (g.length < a.length) {
      const allIn = g.every(x => a.some(y => close(x, y)));
      return {ok: false, msg: allIn ? `Riktig så langt, men det finnes ${a.length} løsninger. Hvilken mangler?` : `Ikke riktig. Denne har ${a.length} løsninger.`};
    }
    if (g.length > a.length) return {ok: false, msg: `For mange svar. Denne har ${a.length === 1 ? 'én løsning' : a.length + ' løsninger'}.`};
    return a.every((x, i) => close(x, g[i])) ? {ok: true} : {ok: false, msg: 'Ikke riktig ennå. Sett prøve på svaret ditt.'};
  }
  if (task.type === 'ineq') {
    const v = task.v || 'x';
    const got = normIneq(vals[0], v);
    if (got.includes('?')) return {ok: false, msg: `Jeg forstår ikke svaret. Skriv for eksempel «${v} < 3», «−2 < ${v} < 4» eller «${v} < 0 eller ${v} > 4».`};
    return task.ans.some(a => normIneq(a, v) === got) ? {ok: true} : {ok: false, msg: 'Ikke riktig. Sjekk tegnet og tallene.'};
  }
  if (task.type === 'pair') {
    const g = vals.map(parseNum);
    if (g.some(isNaN)) return {ok: false, msg: 'Fyll inn et tall i begge feltene.'};
    const okA = close(g[0], task.ans[0]), okB = close(g[1], task.ans[1]);
    if (okA && okB) return {ok: true};
    if (okA || okB) return {ok: false, msg: `${okA ? task.labels[0] : task.labels[1]} er riktig. Sett den inn i en av likningene for å finne den andre.`};
    return {ok: false, msg: 'Ikke riktig. Sett prøve i begge likningene.'};
  }
}

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);
function tasksOf(o) { return Object.entries(o.spor).flatMap(([s, list]) => list.map((t, i) => `${o.id}-s${s}-${i}`)); }

function renderNav() {
  $('okter').innerHTML = OKTER.map((o, i) =>
    `<button role="tab" aria-selected="${i === cur.okt}" data-i="${i}"><span class="n">${i + 1}</span> ${o.nav}</button>`).join('');
  $('okter').querySelectorAll('button').forEach(b => b.onclick = () => { cur = {okt: +b.dataset.i, spor: 1}; renderAll(); });
}

function renderSide() {
  const o = OKTER[cur.okt];
  $('mal').innerHTML = o.mal.map(m => `<li>${m}</li>`).join('');
  $('tips').innerHTML = o.tips.map(m => `<li>${m}</li>`).join('');
  $('prog').innerHTML = OKTER.map((ok, i) => {
    const ids = tasksOf(ok), n = ids.filter(id => solved[id]).length;
    return `<div class="prog-row ${i === cur.okt ? 'cur' : ''}"><span>${i + 1}. ${ok.nav}</span><span>${n}/${ids.length}</span><div class="bar"><span style="width:${100 * n / ids.length}%"></span></div></div>`;
  }).join('');
}

function renderMain() {
  const o = OKTER[cur.okt];
  const labels = o.sporLabels || SPOR_LABELS;
  const sporKeys = Object.keys(o.spor).map(Number);
  let h = `<h2>${o.title}</h2>
    <div class="huske"><strong>Huskeregel</strong>${o.huske}</div>
    <details class="eks"><summary>Se eksempel</summary><div class="body">
      ${o.eks.map(l => `<div class="line">${l}</div>`).join('')}
      <p class="note">${o.eksNote}</p></div></details>`;
  if (sporKeys.length > 1) {
    h += `<div class="spor" role="tablist">` + sporKeys.map(s => {
      const ids = o.spor[s].map((t, i) => `${o.id}-s${s}-${i}`), n = ids.filter(id => solved[id]).length;
      return `<button role="tab" aria-selected="${s === cur.spor}" data-s="${s}">${labels[s][0]} <span class="count">${n}/${ids.length}</span><small>${labels[s][1]}</small></button>`;
    }).join('') + `</div>`;
  }
  h += `<div id="tasks"></div>`;
  $('main').innerHTML = h;
  $('main').querySelectorAll('.spor button').forEach(b => b.onclick = () => { cur.spor = +b.dataset.s; renderMain(); });
  const list = o.spor[cur.spor];
  const box = $('tasks');
  list.forEach((t, i) => box.appendChild(renderTask(t, `${o.id}-s${cur.spor}-${i}`, `${cur.okt + 1}.${cur.spor}.${i + 1}`)));
}

function renderTask(t, id, label) {
  const el = document.createElement('div');
  el.className = 'task' + (solved[id] ? ' solved' : '');
  const q = t.plain ? `<div class="q">${t.q}</div>` : `<div class="q"><span class="math">${t.q}</span></div>`;
  let row = '';
  if (t.type === 'num') {
    row = `<label class="pl">${t.plain ? 'Svar:' : 'x ='} <input type="text" aria-label="Svar" autocomplete="off"></label>`;
  } else if (t.type === 'ineq') {
    row = `<input type="text" aria-label="Svar som ulikhet" autocomplete="off" placeholder="f.eks. ${t.v || 'x'} < 3">
      <span class="sym">${['<', '>', '≤', '≥', ' eller '].map(s => `<button type="button" data-sym="${s}">${s.trim()}</button>`).join('')}</span>`;
  } else if (t.type === 'pair') {
    row = t.labels.map(l => `<label class="pl">${l} = <input type="text" class="small" aria-label="${l}" autocomplete="off"></label>`).join('');
  } else if (t.type === 'choice') {
    row = `<div class="choices">${t.options.map((o, k) => `<button type="button" data-k="${k}">${o}</button>`).join('')}</div>`;
  }
  if (t.type === 'bisect') {
    el.innerHTML = `<div class="head"><span class="num">${label}</span>${q}</div><div class="bis" style="padding-left:calc(2.4em + 12px)"></div>`;
    bisect(el.querySelector('.bis'), id, el);
    return el;
  }
  const btns = t.type === 'choice' ? `<button class="btn ghost" data-act="hint">Hint</button>` :
    `<button class="btn main" data-act="check">Sjekk svar</button><button class="btn ghost" data-act="hint">Hint</button>`;
  el.innerHTML = `<div class="head"><span class="num">${label}</span>${q}</div>
    <div class="row">${row}${btns}</div>
    ${t.type === 'num' && Array.isArray(t.ans) && t.ans.length > 1 && !t.plain ? '<div class="hint-format">Flere løsninger? Skriv for eksempel «3 og −5».</div>' : ''}
    ${t.type === 'num' && !t.plain && Array.isArray(t.ans) && t.ans.length === 1 ? '' : ''}
    <div class="fb"></div>`;
  const fb = el.querySelector('.fb');
  const inputs = [...el.querySelectorAll('input')];
  const show = (cls, html) => { fb.insertAdjacentHTML('beforeend', `<div class="msg ${cls}">${html}</div>`); };
  const stepsHtml = () => `<div class="msg steps"><strong>Løsning</strong>${t.steps.map(s => `<div>${s}</div>`).join('')}</div>`;
  const wrong = msg => {
    attempts[id] = (attempts[id] || 0) + 1;
    fb.innerHTML = '';
    show('bad', msg);
    if (attempts[id] === 1) show('hint', `<strong>Hint:</strong> ${t.hint}`);
    if (attempts[id] >= 2) {
      show('hint', `<strong>Hint:</strong> ${t.hint}`);
      fb.insertAdjacentHTML('beforeend', `<button class="btn ghost" style="margin-top:8px" data-act="sol">Vis løsning</button>`);
      fb.querySelector('[data-act=sol]').onclick = () => { fb.innerHTML = stepsHtml(); };
    }
    tilt(false);
  };
  const right = () => {
    fb.innerHTML = '';
    show('ok', '<strong>Riktig!</strong>');
    fb.insertAdjacentHTML('beforeend', stepsHtml());
    el.classList.add('solved');
    if (!solved[id]) { solved[id] = 1; save(); renderSide(); updateSporCounts(); }
    tilt(true);
  };
  el.querySelector('[data-act=hint]').onclick = () => { if (!fb.querySelector('.hint')) show('hint', `<strong>Hint:</strong> ${t.hint}`); };
  if (t.type === 'choice') {
    el.querySelectorAll('.choices button').forEach(b => b.onclick = () => {
      el.querySelectorAll('.choices button').forEach(x => x.classList.remove('wrong', 'right'));
      if (+b.dataset.k === t.correct) { b.classList.add('right'); right(); }
      else { b.classList.add('wrong'); wrong('Ikke den beste metoden her.'); }
    });
  } else {
    const run = () => {
      const vals = inputs.map(i => i.value);
      if (vals.some(v => !v.trim())) { fb.innerHTML = ''; show('bad', 'Skriv et svar først.'); return; }
      const r = check(t, vals);
      r.ok ? right() : wrong(r.msg);
    };
    el.querySelector('[data-act=check]').onclick = run;
    inputs.forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') run(); }));
    el.querySelectorAll('[data-sym]').forEach(b => b.onclick = () => {
      const inp = inputs[0], s = b.dataset.sym, p = inp.selectionStart ?? inp.value.length;
      inp.value = inp.value.slice(0, p) + s + inp.value.slice(inp.selectionEnd ?? p);
      inp.focus(); inp.selectionStart = inp.selectionEnd = p + s.length;
    });
  }
  return el;
}

function updateSporCounts() {
  const o = OKTER[cur.okt];
  $('main').querySelectorAll('.spor button').forEach(b => {
    const s = +b.dataset.s, ids = o.spor[s].map((t, i) => `${o.id}-s${s}-${i}`);
    b.querySelector('.count').textContent = `${ids.filter(id => solved[id]).length}/${ids.length}`;
  });
}

/* ---------- Halveringsmetoden ---------- */
function bisect(box, id, card) {
  const f = x => x ** 3 + x - 4;
  let a = 1, b = 2, rows = [];
  const sign = v => v > 0 ? '<span class="pos">+</span>' : '<span class="neg">−</span>';
  function draw(msg) {
    const done = b - a < 0.01;
    const m = (a + b) / 2, fm = f(m);
    let h = `<p>f(x) = x³ + x − 4. Vi vet at f(1) = −2 og f(2) = 6, så grafen krysser x-aksen mellom 1 og 2. Velg hvilken halvdel nullpunktet ligger i, helt til intervallet er kortere enn 0,01.</p>
      <div class="bis-wrap"><table><thead><tr><th>Steg</th><th>a</th><th>b</th><th>m</th><th>f(a)</th><th>f(m)</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${fmt(r.a)}</td><td>${fmt(r.b)}</td><td>${fmt(r.m)}</td><td>${sign(f(r.a))}</td><td>${sign(f(r.m))}</td></tr>`).join('')}
      </tbody></table></div>`;
    if (!done) {
      h += `<p><strong>Nå:</strong> intervall [${fmt(a)} ; ${fmt(b)}], midtpunkt m = ${fmt(m)}.<br>f(${fmt(a)}) = ${fmt(f(a))} og f(${fmt(m)}) = ${fmt(fm)}.</p>
        <div class="row" style="padding-left:0"><button class="btn ghost" data-h="L">Nullpunktet er i [${fmt(a)} ; ${fmt(m)}]</button>
        <button class="btn ghost" data-h="R">Nullpunktet er i [${fmt(m)} ; ${fmt(b)}]</button></div>`;
    } else {
      h += `<p><strong>Intervallet er nå [${fmt(a)} ; ${fmt(b)}].</strong> Hva er løsningen med to desimaler?</p>
        <div class="row" style="padding-left:0"><label class="pl">x ≈ <input type="text" class="small" aria-label="Svar med to desimaler"></label><button class="btn main" data-h="ans">Sjekk svar</button></div>`;
    }
    h += `<div class="fb" style="padding-left:0">${msg || ''}</div>`;
    box.innerHTML = h;
    box.querySelectorAll('[data-h]').forEach(btn => btn.onclick = () => {
      if (btn.dataset.h === 'ans') {
        const v = parseNum(box.querySelector('input').value);
        if (close(v, 1.38, 0.006)) {
          card.classList.add('solved');
          if (!solved[id]) { solved[id] = 1; save(); renderSide(); updateSporCounts(); }
          tilt(true);
          draw('<div class="msg ok"><strong>Riktig!</strong> x ≈ 1,38. Med sju halveringer gikk vi fra et intervall på 1 til under 0,01.</div>');
        } else { tilt(false); draw('<div class="msg bad">Ikke riktig. Begge endepunktene i intervallet runder av til samme tall med to desimaler.</div>'); }
        return;
      }
      const leftOK = f(a) * fm < 0, choseLeft = btn.dataset.h === 'L';
      if (leftOK === choseLeft) {
        rows.push({a, b, m});
        if (leftOK) b = m; else a = m;
        tilt(true); draw();
      } else {
        tilt(false);
        draw(`<div class="msg hint"><strong>Hint:</strong> Nullpunktet ligger der funksjonsverdiene har motsatt fortegn. f(a) er ${f(a) > 0 ? 'positiv' : 'negativ'} og f(m) er ${fm > 0 ? 'positiv' : 'negativ'}.</div>`);
      }
    });
  }
  draw();
}

/* ---------- Vekta ---------- */
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tiltTimer;
function tilt(ok) {
  const beam = $('beam');
  clearTimeout(tiltTimer);
  if (reduce) { beam.style.transform = 'rotate(0deg)'; return; }
  if (ok) beam.style.transform = 'rotate(0deg)';
  else { beam.style.transform = `rotate(${Math.random() < .5 ? -10 : 10}deg)`; tiltTimer = setTimeout(() => beam.style.transform = 'rotate(0deg)', 900); }
}

function renderAll() { renderNav(); renderSide(); renderMain(); }
$('reset').onclick = () => { if (confirm('Vil du nullstille all fremdrift på denne siden?')) { solved = {}; save(); renderAll(); } };
renderAll();
setTimeout(() => tilt(true), 350);
